<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahrena Console protótipo</title>
<style>
/* VOICE work: a calm console for devs and product people alike
   IDEA a macOS app window: sidebar, grouped lists, sessions as conversations
   PICTURE the Mural itself, with the question that needs you drawn largest
   COLOUR neutral greys, orange for action, yellow only for "needs you", red only for errors, a quiet hue per agent
   TYPE the system font (SF Pro on Mac), SF Mono for code
   LAYOUT sidebar + content; under 860px the sidebar becomes a drawer */
:root{color-scheme:light dark;
--bg:light-dark(#f4f4f5,#17171b);--side:light-dark(#ececef,#1b1b20);--card:light-dark(#fdfdfd,#1e1e24);--line:light-dark(#e3e3e6,#2e2e36);
--ink:light-dark(#17171b,#f2f2f3);--sub:light-dark(#4a4a52,#c4c4c8);--meta:light-dark(#64646c,#9a9aa0);--seg:light-dark(#e6e6e9,#26262c);
--av:light-dark(#ececef,#2e2e36);--track:light-dark(#e6e6e9,#33333b);--y:light-dark(#664e04,#ffc30a);--yb:light-dark(#fdf6e0,#393221);--ybd:light-dark(#f1e2b0,#4f4426);
--ydot:light-dark(#a87e00,#ffc30a);--r:light-dark(#b42a2a,#f06463);--rb:light-dark(#fae7e7,#362328);--o:light-dark(#ab5316,#f47720);--ob:light-dark(#fcede2,#382924);--obd:light-dark(#f4d3bb,#55392a);
--prim:light-dark(#17171b,#e4e4e7);--onprim:light-dark(#fdfdfd,#17171b);--orange:#f47720;--shadow:light-dark(rgba(0,0,0,.14),rgba(0,0,0,.5));
--violet:light-dark(#5b3fa8,#c4b2f5);--violet-b:light-dark(#efe9fb,#2d2640);--blue:light-dark(#2456a6,#9cc1f5);--blue-b:light-dark(#e6eefb,#1f2a3d);
--teal:light-dark(#11695f,#84d3c8);--teal-b:light-dark(#e2f3f1,#1c3331);--indigo:light-dark(#3b4594,#aeb6f0);--indigo-b:light-dark(#e8eaf8,#262a42);
--rc:8px;--rb:6px;--rt:4px;--rs:8px;--rsi:6px}
:root[data-radius=square]{--rc:2px;--rb:2px;--rt:2px;--rs:3px;--rsi:2px}
:root[data-radius=round]{--rc:14px;--rb:8px;--rt:6px;--rs:10px;--rsi:7px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.app{display:flex;min-height:100%}
.side{flex:0 0 248px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-top{padding:14px 10px 6px}
.side-nav{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 8px;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 12px}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}
.brand small{font-size:12px;color:var(--meta)}
.ib{width:30px;height:30px;border:0;background:transparent;color:var(--sub);border-radius:var(--rb);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--seg)}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;border-radius:var(--rb);background:var(--card);border:1px solid var(--line);color:var(--meta);cursor:pointer;width:100%;text-align:left;white-space:nowrap;font-size:13.5px}
kbd{font-family:ui-monospace,"SF Mono",monospace;font-size:11px;padding:1px 6px;border-radius:var(--rt);border:1px solid var(--line);color:var(--sub);margin-left:auto}
.lbl{font-family:ui-monospace,"SF Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--meta);padding:0 10px;margin:11px 0 3px}
.nav{display:flex;align-items:center;gap:11px;min-height:31px;padding:0 10px;border-radius:var(--rb);font-size:14px;text-decoration:none;color:var(--sub);border:1px solid transparent;white-space:nowrap}
.nav:hover{background:color-mix(in srgb,var(--card) 60%,transparent);color:var(--ink)}
.nav[aria-current=page]{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:500}
.nav svg{flex:none;opacity:.85}
.cnt{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--meta)}
.tg{margin-left:auto;font-size:11.5px;font-weight:500;padding:1px 6px;border-radius:var(--rt);border:1px solid;white-space:nowrap}
.tg.y{color:var(--y);background:var(--yb);border-color:var(--ybd)}.tg.o{color:var(--o);background:var(--ob);border-color:var(--obd)}
.foot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.live{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:9px 12px}
.live b{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--sub);box-shadow:0 0 0 3px var(--seg);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.me{display:flex;align-items:center;gap:8px;padding:0 2px}
.me .ib{width:28px;height:28px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--av);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--sub);flex:none}
main{flex:1 1 560px;padding:28px 40px 88px;display:flex;flex-direction:column;gap:26px;max-width:1360px}
.top{display:none}
h1{margin:0 0 6px;font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.lead{margin:0;font-size:17px;color:var(--sub);max-width:720px}
.lead b{color:var(--ink);font-weight:600}
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.head>div:first-child{flex:1 1 380px}
.acts{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;border-radius:var(--rb);border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.ghost{background:transparent}
.btn.prim{background:var(--prim);border-color:var(--prim);color:var(--onprim);font-weight:500}
.btn.go{background:var(--orange);border-color:var(--orange);color:#17171b;font-weight:500}
.lnk{background:none;border:0;padding:0;font-size:13.5px;color:var(--sub);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.segs{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:var(--rs);background:var(--seg)}
.seg button{border:0;background:transparent;font-size:13.5px;padding:5px 12px;border-radius:var(--rsi);cursor:pointer;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:500}
.seg .y{color:var(--y)}
.drop{position:relative}
.menu{position:absolute;left:0;top:38px;z-index:20;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:4px;box-shadow:0 12px 32px var(--shadow)}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:var(--rb);cursor:pointer;font-size:14px;text-align:left}
.menu button:hover,.menu button[aria-checked=true]{background:var(--seg)}
.menu .c{margin-left:auto;color:var(--meta);font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:18px;display:flex;flex-direction:column;gap:12px;transition:opacity .2s}
.card.done{opacity:.8}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--av);color:var(--sub)}
.av.violet{background:var(--violet-b);color:var(--violet)}.av.blue{background:var(--blue-b);color:var(--blue)}.av.teal{background:var(--teal-b);color:var(--teal)}.av.indigo{background:var(--indigo-b);color:var(--indigo)}
.who{display:flex;align-items:center;gap:10px}
.who .age{color:var(--meta);font-size:14px;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--sub);white-space:nowrap}
.st svg{flex:none}
.who .st{margin-left:auto}
.mach{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mach svg{flex:none;opacity:.8}
.ttl{font-size:13.5px;color:var(--meta);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl:hover{color:var(--ink)}
.ask{margin:0;font-size:18px;line-height:1.4;font-weight:500;letter-spacing:-.01em}
.tech{color:var(--meta)}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sent{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.sent b{color:var(--ink);font-weight:600}
.cfoot{display:flex;align-items:center;gap:10px;padding-top:12px;margin-top:auto;border-top:1px solid var(--line);font-size:13px;color:var(--meta)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--sub)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:hover{background:color-mix(in srgb,var(--seg) 45%,transparent)}
.row b{display:block;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:13.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--meta);white-space:nowrap}
.list>.row:last-child{border-bottom:0}
@media(min-width:1280px){.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.duo>.row:nth-child(odd){border-right:1px solid var(--line)}.duo>.row:nth-last-child(-n+2):nth-child(odd),.duo>.row:last-child{border-bottom:0}}
.pair{display:flex;flex-wrap:wrap;gap:28px}
.pair>section{flex:1 1 420px;display:flex;flex-direction:column;gap:12px}
section{display:flex;flex-direction:column;gap:12px}
.empty{padding:16px;font-size:14px;color:var(--meta)}
.calm{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:24px 28px;display:flex;align-items:center;gap:16px}
.calm b{display:block;font-size:17px}
.pop{position:absolute;right:0;top:42px;z-index:20;width:300px;background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px var(--shadow)}
.pop label{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 0;cursor:pointer}
.pop input{width:16px;height:16px;margin:0;accent-color:var(--orange)}
.pop small{font-size:12.5px;color:var(--meta)}
body.compact main{padding:20px 28px 80px;gap:18px}
body.compact h1{font-size:22px}
body.compact .lead{font-size:15px}
body.compact h2{font-size:16px}
body.compact .card{padding:14px;gap:9px}
body.compact .ask{font-size:15.5px}
body.compact .cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px}
body.compact .row{padding:8px 14px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:24px 28px;display:flex;flex-wrap:wrap;gap:28px}
.big{flex:0 1 220px;display:flex;flex-direction:column;gap:10px;padding-right:28px;border-right:1px solid var(--line)}
.big .n{font-size:64px;line-height:1;font-weight:500;letter-spacing:-.04em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
.stats span{display:block;font-size:13px;color:var(--meta)}
.stats b{font-size:26px;font-weight:500;letter-spacing:-.02em}
.hours{display:flex;gap:14px;align-items:flex-end}
.hours>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.hours .marks{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:64px;width:100%;border-bottom:1px solid var(--line)}
.hours .marks i{width:8px;border-radius:3px 3px 0 0;flex:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.legend i{display:inline-block;width:8px;height:12px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.feed{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:6px 18px}
.feed div{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--sub);align-items:flex-start}
.feed div:last-child{border-bottom:0}
.feed svg{margin-top:2px;flex:none}
.feed b{color:var(--ink);font-weight:500}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:var(--rb);background:var(--card);border:1px solid var(--line);color:var(--meta);flex:1 1 240px;max-width:360px}
.field input{flex:1;border:0;background:transparent;outline:none;font-size:16px;color:var(--ink)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-weight:400;font-size:12.5px;color:var(--meta);padding:10px 18px;border-bottom:1px solid var(--line)}
td{padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;color:var(--sub);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--seg) 45%,transparent)}
td.n{text-align:right;white-space:nowrap}
.who-cell{display:flex;align-items:center;gap:12px}
.who-cell b{display:block;color:var(--ink);font-size:15px;font-weight:500}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 2px;font-size:14.5px;color:var(--sub);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.split{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.split>div{flex:999 1 520px;display:flex;flex-direction:column;gap:16px}
.split>aside{flex:1 1 300px;max-width:380px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg p{margin:4px 0 0;font-size:15px;line-height:1.55}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--rb);background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--sub);margin-top:4px}
.step{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.step.ok{color:var(--sub)}.step.now{font-weight:600}.step.next{color:var(--meta)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--meta)}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(400px,calc(100vw - 32px))}
.toast{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:12px 14px;box-shadow:0 10px 28px var(--shadow);display:flex;gap:10px;align-items:center;font-size:14px;animation:in .25s ease-out}
.toast a{margin-left:auto;font-size:13.5px;white-space:nowrap}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.k-wrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;z-index:60}
.k{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--rc);box-shadow:0 20px 50px var(--shadow);overflow:hidden}
.k input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:17px;outline:none}
.k ul{list-style:none;margin:0;padding:6px;max-height:360px;overflow:auto}
.k li a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--rb);text-decoration:none}
.k li a.on,.k li a:hover{background:var(--seg)}
.k li span{margin-left:auto}
.note{font-size:12.5px;color:var(--meta)}
.ph{background:var(--card);border:1px solid var(--line);border-radius:var(--rc);padding:28px;max-width:640px}
.scrim{display:none}
.corners{position:fixed;left:272px;bottom:16px;z-index:45;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--rc);box-shadow:0 8px 24px var(--shadow);font-size:13px;color:var(--sub)}
.corners .seg{padding:2px}
.corners .seg button{padding:4px 10px;font-size:13px}
@media(prefers-reduced-motion:reduce){.pulse,.toast{animation:none}.card{transition:none}}
@media(max-width:860px){
.side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px var(--shadow)}
body.menu .side{transform:none}
body.menu .scrim{display:block;position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.3)}
.top{display:flex;align-items:center;gap:10px;margin:-8px 0 -6px}
main{padding:20px 16px 88px}
h1{font-size:26px}
.big{border-right:0;padding-right:0}
.corners{left:16px}
}
@media(max-width:600px){.cards{grid-template-columns:minmax(0,1fr)}.row .r .mach{display:none}.acts{width:100%}.pop{left:0;right:auto;width:min(300px,calc(100vw - 32px))}.corners{left:8px;right:8px;bottom:8px;justify-content:space-between}.hours{gap:6px}.hours .marks i{width:5px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Telas"></aside>
  <div class="scrim" data-act="menu"></div>
  <main id="main"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="kbox"></div>

{

function greet() { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }

  const msgs = chat.map(([who, ini, txt]) => `<div class="msg">${who === 'Você' ? `<span class="av">${esc(ini)}</span>` : av(who, ini)}<div><b style="font-size:13.5px">${esc(who)}</b>${txt[0] === '#' ? `<div><span class="chip">${ic('chev', 14)}${esc(txt.slice(1))}</span></div>` : `<p>${esc(txt)}</p>`}</div></div>`).join('');

  const body = st.tab === 'agents' ? `<div class="list">${agents.map((w) => `<div class="row">${av(w, w.slice(0, 2) === 'Ar' ? 'Ar' : w[0])}<span><b>${esc(w)}</b><span class="s">${w === s.agent ? 'Conduz a sessão' : 'Chamado para uma parte do plano'}</span></span><span class="r">${w === s.agent && s.st === 'work' ? `<span class="st">${stIcon('work', frac(s))}Trabalhando</span>` : `<span class="st">${stIcon('idle')}Em pausa</span>`}</span></div>`).join('')}</div>`
    : st.tab === 'time' ? `<div class="list">${chat.map(([who, , txt], i) => `<div class="row"><span class="mono num" style="color:var(--meta)">${esc(addMin(s.start, i * 7))}</span><span><b style="font-weight:400">${esc(who)}</b><span class="s">${esc(txt.replace(/^#/, ''))}</span></span><span></span></div>`).join('')}</div>`

  <div class="head"><div><div style="display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap">${status(s)}<span class="note" style="font-size:13.5px;display:inline-flex;gap:6px;align-items:center">${mach(s)} · começou às ${esc(s.start)}</span></div><h1 style="font-size:28px">${esc(s.title)}</h1></div>

  <div class="tabs" role="tablist">${tabs.map(([k, lb]) => `<button type="button" role="tab" data-act="tab" data-v="${k}" aria-selected="${st.tab === k}">${lb}</button>`).join('')}</div>
  <div class="split"><div>${body}</div>

function addMin(hm, d) { const [h, m] = hm.split(':').map(Number); const t = h * 60 + m + d; return String(Math.floor(t / 60) % 24).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function placeholder(name) { return `${topbar()}<h1>${esc(name)}</h1><div class="ph"><p style="margin:0 0 10px;font-size:16px">Esta tela ainda não está no protótipo.</p><p class="note" style="margin:0 0 14px;font-size:14px">O protótipo cobre Início, Mural ao vivo, Sessões e o Detalhe de cada sessão. As outras telas seguem a mesma linguagem depois que a direção for aprovada.</p><a class="btn" href="#mural">Voltar ao Mural</a></div>`; }
const NAMES = { atividade: 'Atividade', kanban: 'Kanban', workflows: 'Workflows', historico: 'Histórico', custos: 'Custos e uso', repos: 'Repositórios', projeto: 'Kanban do projeto', trabalho: 'Quadro do trabalho', dev: 'Dev Console', decisoes: 'Decisões das sessões', adr: 'ADR', pdr: 'PDR', mac: 'Este Mac', ws: 'Workstation', config: 'Configuração do Claude', conexoes: 'Conexões' };

const EVENTS = [
  () => { const s = byId('w1'); if (s.st === 'work' && s.step < s.total) { s.step++; s.doing = 'Iris está rodando os testes'; FEED.unshift([now(), 'work', 'Iris', 'terminou de escrever os testes do leitor de faturas']); } },
  () => { const s = byId('w2'); if (s.st !== 'work') return; Object.assign(s, { st: 'need', kind: 'perm', ask: 'Posso rodar os testes de integração na Workstation?', why: 'Eles sobem um banco temporário e levam cerca de 3 minutos.', opts: ['Permitir uma vez', 'Negar'], since: 0 }); FEED.unshift([now(), 'perm', 'Claude', 'pediu permissão em Painel de tempo de resposta']); toast('Claude pede permissão em Painel de tempo de resposta', '#mural', 'perm'); },
  () => { const s = byId('w3'); if (s.st !== 'work') return; Object.assign(s, { st: 'done', note: 'PR aberto', doing: 'PR aberto', at: now(), step: s.total }); FEED.unshift([now(), 'done', 'Claude', 'terminou Traduzir as mensagens de erro']); toast('Concluída: Traduzir as mensagens de erro', '#s-w3', 'done'); }
];
function now() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
let ev = 0;
const tick = setInterval(() => { if (ev >= EVENTS.length) { clearInterval(tick); return; } EVENTS[ev++](); if (!st.exibir && !st.mm && !document.activeElement?.matches('input')) render(); else $('#side').innerHTML = sidebar((location.hash || '#mural').slice(1)); }, 15000);

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-href]');
  if (!t) { if ((st.exibir && !e.target.closest('.pop')) || (st.mm && !e.target.closest('.menu'))) { st.exibir = false; st.mm = false; render(); } return; }
  if (t.dataset.href && !t.dataset.act) { location.hash = t.dataset.href; return; }
  const a = t.dataset.act, v = t.dataset.v;
  if (a === 'radius') { store.radius = v; save(); drawCorners(); return; }
  if (a === 'theme') { const next = darkNow() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; store.theme = next; save(); render(); }
  else if (a === 'filter') { st.filter = v; render(); }
  else if (a === 'mm') { st.mm = !st.mm; st.exibir = false; render(); }
  else if (a === 'mach') { st.mach = v; st.mm = false; render(); }
  else if (a === 'ans') answer(t.dataset.id, t.dataset.a);
  else if (a === 'undo') undo(t.dataset.id);
  else if (a === 'exibir') { st.exibir = !st.exibir; st.mm = false; render(); }
  else if (a === 'dens') { st.density = v; st.show = null; save(); render(); }
  else if (a === 'sf') { st.sf = v; render(); }
  else if (a === 'clear') { st.sf = 'all'; st.sq = ''; render(); }
  else if (a === 'tab') { st.tab = v; render(); }
  else if (a === 'write') { st.writing = !st.writing; render(); }
  else if (a === 'menu') document.body.classList.toggle('menu');
  else if (a === 'k') openK();
  else if (a === 'kclose' && e.target === t) { st.k = null; drawK(); }
  else if (a === 'new') toast('Nova sessão: no app, aqui você escolhe a pasta e onde abrir.');
  else if (a === 'toast') toast(v);
});
document.addEventListener('change', (e) => {
  const t = e.target; if (t.dataset.act === 'show') { st.show = Object.assign({}, show(), { [t.dataset.v]: t.checked }); save(); render(); const el = $('#show-' + t.dataset.v); if (el) el.focus(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'sq') { st.sq = e.target.value; $('#tb').innerHTML = rowsHtml(); }
  if (e.target.id === 'kq') { st.k.q = e.target.value; st.k.i = 0; drawK(); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const v = ($('#wr')?.value || '').trim(); if (!v) { $('#wr')?.focus(); return; }
  st.writing = false; answer(f.dataset.form, v);
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); st.k ? (st.k = null, drawK()) : openK(); return; }
  if (!st.k) { if (e.key === 'Escape' && (st.exibir || st.mm)) { st.exibir = false; st.mm = false; render(); } return; }
  const items = kItems();
  if (e.key === 'Escape') { st.k = null; drawK(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); st.k.i = Math.min(items.length - 1, st.k.i + 1); drawK(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); st.k.i = Math.max(0, st.k.i - 1); drawK(); }
  else if (e.key === 'Enter' && items[st.k.i]) { location.hash = '#s-' + items[st.k.i].id; st.k = null; drawK(); }
});
document.addEventListener('click', (e) => { if (st.k && e.target.closest('.k li a')) { st.k = null; setTimeout(drawK); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
window.addEventListener('hashchange', render);
drawCorners();
render();
}
